<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 60" fill="none">
  <!-- Microsoft 4-color squares -->
  <g transform="translate(12, 12)">
    <rect x="0" y="0" width="16" height="16" fill="#F25022"/>
    <rect x="19" y="0" width="16" height="16" fill="#7FBA00"/>
    <rect x="0" y="19" width="16" height="16" fill="#00A4EF"/>
    <rect x="19" y="19" width="16" height="16" fill="#FFB900"/>
  </g>
  <!-- Text: Microsoft 365 -->
  <text x="60" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Segoe UI Web (West European)', Segoe, sans-serif" font-size="16" font-weight="600" fill="#242424" letter-spacing="-0.2px">Microsoft</text>
  <text x="60" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Segoe UI Web (West European)', Segoe, sans-serif" font-size="17" font-weight="700" fill="#0078D4" letter-spacing="0.5px">365</text>
  <g transform="translate(100, 32)">
    <!-- Cloud & Security tag -->
    <rect x="0" y="0" width="70" height="14" rx="7" fill="#EBF3FC"/>
