<svg width="540" height="533" viewBox="0 0 540 533" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes radarSweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes slowCounterRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes nodeFloat1 {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-7px) scale(1.04); }
      }
      @keyframes nodeFloat2 {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(7px) scale(1.04); }
      }
      @keyframes nodeFloat3 {
        0%, 100% { transform: translate(0px, 0px); }
        50% { transform: translate(-4px, -6px); }
      }
      @keyframes gearSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulseAura {
        0%, 100% { opacity: 0.15; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(1.08); }
      }

      .radar-sweep-beam {
        transform-origin: 274.6px 266.3px;
        animation: radarSweep 7s linear infinite;
      }
      .orbit-dashed-ring {
        transform-origin: 274.6px 266.3px;
        animation: slowCounterRotate 60s linear infinite;
      }
      .node-phone-elem {
        transform-origin: 118.5px 77.5px;
        animation: nodeFloat1 4.2s ease-in-out infinite;
      }
      .node-mail-elem {
        transform-origin: 441px 417px;
        animation: nodeFloat2 4.8s ease-in-out infinite 0.5s;
      }
      .node-chat-elem {
        transform-origin: 430px 89px;
        animation: nodeFloat3 5.4s ease-in-out infinite 1.2s;
      }
      .node-gear-elem {
        transform-origin: 127px 475px;
        animation: gearSpin 14s linear infinite;
      }
      .radar-center-aura {
        transform-origin: 278px 266px;
        animation: pulseAura 3s ease-in-out infinite;
      }
    </style>

    <!-- Radar Sweep Beam Gradient -->
    <radialGradient id="radarBeamGrad" cx="274.6" cy="266.3" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.5" />
      <stop offset="40%" stop-color="#00E5FF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </radialGradient>

    <!-- Center Pulse Aura Gradient -->
    <radialGradient id="centerGlowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C11E23" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#C11E23" stop-opacity="0" />
    </radialGradient>

