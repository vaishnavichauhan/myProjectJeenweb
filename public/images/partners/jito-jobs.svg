<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 110" width="100%" height="100%">
  <!-- Top 4 Color Blocks -->
  <g>
    <!-- Blue Block: J -->
    <rect x="2" y="4" width="56" height="64" fill="#1B287B" rx="1.5" />
    <text x="30" y="53" font-family="'Times New Roman', Times, 'Georgia', serif" font-size="54" font-weight="bold" fill="#FFFFFF" text-anchor="middle">J</text>

    <!-- Green Block: I -->
    <rect x="60" y="4" width="56" height="64" fill="#009A44" rx="1.5" />
    <text x="88" y="53" font-family="'Times New Roman', Times, 'Georgia', serif" font-size="54" font-weight="bold" fill="#FFFFFF" text-anchor="middle">I</text>

    <!-- Gold/Yellow Block: T -->
    <rect x="118" y="4" width="56" height="64" fill="#FBAE17" rx="1.5" />
    <text x="146" y="53" font-family="'Times New Roman', Times, 'Georgia', serif" font-size="54" font-weight="bold" fill="#FFFFFF" text-anchor="middle">T</text>

    <!-- Red Block: O -->
    <rect x="176" y="4" width="56" height="64" fill="#E31B23" rx="1.5" />
    <text x="204" y="53" font-family="'Times New Roman', Times, 'Georgia', serif" font-size="54" font-weight="bold" fill="#FFFFFF" text-anchor="middle">O</text>
  </g>

  <!-- Bottom JOBS text -->
  <text x="117" y="101" font-family="'Times New Roman', Times, 'Georgia', serif" font-size="29" font-weight="500" letter-spacing="6" fill="#1E293B" text-anchor="middle">JOBS</text>
</svg>
