<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 70" width="100%" height="100%">
  <!-- Medical Care Cross / Heart Emblem -->
  <g transform="translate(10, 8)">
    <rect x="16" y="4" width="16" height="46" rx="4" fill="#008080" />
    <rect x="1" y="19" width="46" height="16" rx="4" fill="#008080" />
    <!-- Center energetic curve -->
    <circle cx="24" cy="27" r="9" fill="#E63946" />
    <circle cx="24" cy="27" r="4.5" fill="#FFFFFF" />
  </g>

  <!-- CARE Text -->
  <text x="75" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="1" fill="#0A3663">CARE</text>
  <!-- HOSPITALS Subtext -->
  <text x="76" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="4.5" fill="#008080">HOSPITALS</text>
</svg>
